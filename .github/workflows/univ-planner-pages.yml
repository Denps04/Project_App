name: Deploy Presentation to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "presentation.html"
      - "Record_2026_06_22_00_15_33_63.mp4"
      - ".github/workflows/univ-planner-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages files
        shell: bash
        run: |
          rm -rf .pages
          mkdir -p .pages
          cp presentation.html .pages/index.html
          cp presentation.html .pages/presentation.html
          cp Record_2026_06_22_00_15_33_63.mp4 .pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
